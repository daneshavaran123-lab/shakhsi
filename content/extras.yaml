en:
  faq:
  - q: What kinds of projects do you take on?
    a: Custom software for touch displays, kiosks and the web; touch stands, kiosks and tables supplied through Daneshavaran; and complete hardware + software packages.
  - q: Can I order only software, or only hardware?
    a: Yes. Each can be ordered on its own — and if you need both, they’re designed together as one integrated package.
  - q: Where does the work start?
    a: With discovery. Before any design, I listen closely to what your audience really needs; then come experience design, hardware and software, and delivery.
  - q: How much does a project cost, and how long does it take?
    a: It depends on the scope. After a discovery session I give you an accurate estimate of time and cost.
  - q: Can a kiosk or table body be designed for my space?
    a: Yes — just as the kids’ touch tables were, from a wooden table to an elephant, each body is shaped for its space and audience.
