fa:
  faq:
  - q: چه نوع پروژه‌هایی را می‌پذیرید؟
    a: نرم‌افزار سفارشی برای نمایشگر لمسی، کیوسک و وب؛ تأمین استند، کیوسک و میز لمسی از شرکت دانش‌آوران؛ و پکیج کامل سخت‌افزار و نرم‌افزار.
  - q: می‌شود فقط نرم‌افزار یا فقط سخت‌افزار سفارش داد؟
    a: بله. هر کدام جداگانه قابل سفارش است؛ و اگر هر دو را با هم بخواهید، به‌صورت یک پکیج یکپارچه طراحی می‌شوند.
  - q: کار از کجا شروع می‌شود؟
    a: از کشف نیاز. پیش از هر طراحی، دقیق می‌شنوم که مخاطب شما واقعاً به چه چیزی نیاز دارد؛ بعد طراحی تجربه، سخت‌افزار و نرم‌افزار و در نهایت تحویل.
  - q: هزینه و زمان پروژه چقدر است؟
    a: به دامنه کار بستگی دارد. بعد از جلسه کشف نیاز، برآورد دقیق زمان و هزینه را ارائه می‌کنم.
  - q: بدنه کیوسک یا میز را می‌شود متناسب با فضا طراحی کرد؟
    a: بله؛ همان‌طور که در میزهای لمسی کودک، از میز چوبی تا میز فیلی، فرم بدنه متناسب با فضا و مخاطب طراحی شده است.
