fa:
  tagline: مدیر محصول و قائم‌مقام مدیرعامل دانش‌آوران؛ نرم‌افزارهایی می‌سازم که به نمایشگرهای لمسی ارزش افزوده می‌دهند — از اتاق مدیران تا موزه.
  about:
  - نرگس جعفر طباطبایی هستم؛ قائم‌مقام مدیرعامل شرکت دانش‌آوران و مدرس دانشگاه.
  - نرم‌افزارهایی می‌سازم که نمایشگر لمسی را از یک سخت‌افزار، به ابزاری کاربردی تبدیل می‌کنند.
  bio: سه‌چهار سال است در حوزه نرم‌افزار و مدیریت محصول کار می‌کنم. شرکت دانش‌آوران نمایشگرهای لمسی عرضه می‌کند و کار من ساختن نرم‌افزارهایی است که روی همین نمایشگرها ارزش افزوده ایجاد می‌کنند. اپلیکیشن‌های این سایت را خودم و به سفارش کارفرمایان مختلف طراحی و ساخته‌ام — از فدراسیون کشتی تا پارک فناوری فاوا. مدتی هم برندینگ شرکت را بر عهده داشتم و شش سال است در دانشگاه تدریس می‌کنم.
  principles:
  - title: تفکر عمیق
    body: پیش از طراحی، مسئله را از چند زاویه می‌کاوم و تا وقتی تصویر روشنی از آن نداشته باشم، سراغ راه‌حل نمی‌روم.
  - title: کشف نیاز اصلی مخاطب
    body: آنچه مخاطب می‌گوید با آنچه واقعاً لازم دارد همیشه یکی نیست؛ کار من پیدا کردن همان نیاز اصلی است.
  - title: از ایده تا اجرا
    body: محصول را تا جایی پیش می‌برم که روی نمایشگر واقعی، در فضای واقعی و برای کاربر واقعی کار کند.
