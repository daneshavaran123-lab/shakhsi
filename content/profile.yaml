en:
  tagline: Product manager and Deputy CEO at Daneshavaran. I build software that turns touch displays into genuinely useful tools — from boardrooms to museums.
  about:
  - I’m Narges Jafar Tabatabaei — Deputy CEO at Daneshavaran and a university lecturer.
  - I build software that turns a touch display from a piece of hardware into a tool people actually use.
  bio: For the past three to four years I’ve worked in software and product management. Daneshavaran supplies touch displays, and my work is building the software that adds value on top of them. I designed and built the apps on this site myself, commissioned by a range of clients — from the Iran Wrestling Federation to Fava Technology Park. I also led the company’s branding for a time, and I’ve been teaching at university for six years.
  principles:
  - title: Deep thinking
    body: Before designing anything I look at the problem from several angles, and I don’t reach for a solution until the picture is clear.
  - title: Finding the real need
    body: What people ask for and what they actually need aren’t always the same. My job is to find that core need.
  - title: From idea to install
    body: I take a product all the way to running on a real display, in a real space, for real users.
  experience:
