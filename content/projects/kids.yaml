  status: محصول تولیدی
  summary: خانواده‌ای از میزهای لمسی و کیوسک‌های تعاملی ویژه کودکان، در اندازه‌های ۲۲، ۳۲ و ۴۳ اینچ، با لانچر اختصاصی که کودک را در محیطی امن و آموزشی نگه می‌دارد.
  intro: این محصولات را از ایده تا طراحی محصول — هم سخت‌افزار و هم نرم‌افزار — طراحی کرده‌ام. بدنه‌ها فرم‌های شاد و کودکانه دارند؛ از میز چوبی تا میزی به شکل فیل. لانچر مخصوص کودکان باعث می‌شود کودک فقط در محیط بازی‌ها و برنامه‌های آموزشی تعیین‌شده بماند و از آن بیرون نرود.
  value: بازی و یادگیری روی صفحه لمسی بزرگ، در محیطی امن که کودک از آن بیرون نمی‌رود.
  hardware: میز لمسی ۲۲، ۳۲ و ۴۳ اینچ و کیوسک لمسی ۲۲ اینچ
