en:
  title: Kids Touch Tables & Kiosks
  category: Interactive kids’ product
  client: Daneshavaran — in-house product
  role: Idea to product design — hardware and software
  status: In production
  summary: A family of touch tables and interactive kiosks for children, in 22″, 32″ and 43″, with a dedicated launcher that keeps kids inside a safe, educational environment.
  intro: I designed these products from idea to product design — both the hardware and the software. The bodies take playful, child-friendly forms, from a wooden table to one shaped like an elephant. A dedicated kids’ launcher keeps children within the chosen games and learning apps, so they can’t wander off into the rest of the device.
  value: Play and learning on a large touch screen, in a safe space children don’t leave.
  hardware: 22″, 32″ and 43″ touch tables and a 22″ touch kiosk
  services:
  - Product design from idea to final prototype
  - Hardware body and form designed for children
  - Kids’ launcher and software design
  features:
  - Dedicated kids’ launcher that stops children leaving for other parts of the device
  - Access to selected games and learning apps
  - Large touch screen for solo and group play
  - Playful bodies — from a wooden table to an elephant
  tech:
  - Kids touch tables in 22″, 32″ and 43″
  - 22″ touch kiosk with a child seat
  - Dedicated launcher software
  uses:
  - Kindergartens and preschools
  - Kids’ play areas in shopping centres
  - Clinic and hospital waiting rooms
  - Libraries and learning centres
