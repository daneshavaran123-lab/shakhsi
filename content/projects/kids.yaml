  - دسترسی به بازی‌ها و برنامه‌های آموزشی منتخب
  - صفحه لمسی بزرگ برای بازی گروهی و انفرادی
  - بدنه شاد و کودکانه؛ از میز چوبی تا میز فیلی
  tech:
  - میز لمسی کودک در اندازه‌های ۲۲، ۳۲ و ۴۳ اینچ
